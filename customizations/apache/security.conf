# Project-level Apache hardening for the Railway deployment.
# It avoids restrictive CSP rules that could break OpenEMR's existing inline
# scripts and legacy clinical workflows.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</IfModule>

<FilesMatch "(?i)^(\.env|composer\.(json|lock)|package(-lock)?\.json|railway\.json|Dockerfile|.*\.(sql|bak|backup|log|ini|dist))$">
    Require all denied
</FilesMatch>
